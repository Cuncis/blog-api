<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CORS Test Page</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
    }
    h1 { font-size: 1.25rem; }
    p.origin {
        color: #666;
        font-size: 0.9rem;
    }
    code {
        background: #f2f2f2;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
    }
    button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .status {
        margin-top: 1rem;
        font-weight: 600;
    }
    .status.ok { color: #16a34a; }
    .status.fail { color: #dc2626; }
    pre {
        margin-top: 1rem;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1rem;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 3rem;
    }
</style>
</head>
<body>
    <h1>CORS Test Page</h1>
    <p class="origin">This page is served from <code id="origin"></code> and calls the Laravel API at <code id="target">http://127.0.0.1:8000/api/health</code>.</p>

    <button id="run">Test /api/health</button>
    <div id="status" class="status"></div>
    <pre id="output">(no request made yet)</pre>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/health';

        document.getElementById('origin').textContent = window.location.origin;

        const button = document.getElementById('run');
        const statusEl = document.getElementById('status');
        const outputEl = document.getElementById('output');

        button.addEventListener('click', async () => {
            button.disabled = true;
            statusEl.textContent = '';
            statusEl.className = 'status';
            outputEl.textContent = 'Requesting…';

            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                });

                const data = await response.json();

                statusEl.textContent = `Success — HTTP ${response.status}`;
                statusEl.classList.add('ok');
                outputEl.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                statusEl.textContent = 'Blocked or failed — check the DevTools console for the CORS error';
                statusEl.classList.add('fail');
                outputEl.textContent = String(error);
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
